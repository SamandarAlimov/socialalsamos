    <script>
      (function () {
        var sent = 0;
        var maxReports = 4;

        function trimText(value, max) {
          if (value == null) return undefined;
          var text = String(value);
          return text.length > max ? text.slice(0, max) : text;
        }

        function safeResource(value) {
          if (!value) return undefined;
          try {
            var parsed = new URL(String(value), window.location.href);
            return parsed.origin === window.location.origin
              ? parsed.pathname
              : parsed.origin + parsed.pathname;
          } catch (_) {
            return trimText(String(value).split('?')[0].split('#')[0], 1600);
          }
        }

        function report(payload) {
          if (sent >= maxReports) return;
          sent += 1;
          payload.path = window.location.pathname;
          payload.userAgent = navigator.userAgent;

          try {
            window.fetch('/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              keepalive: true
            }).catch(function () {});
          } catch (_) {
            // Diagnostics must never interfere with application startup.
          }
        }

        window.__alsamosReportClientError = report;

        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target !== window && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            report({
              kind: 'resource-error',
              tag: target.tagName,
              resource: safeResource(target.src || target.href),
              message: 'Startup resource failed to load'
            });
            return;
          }

          report({
            kind: 'window-error',
            message: trimText(event.message || 'Unknown browser error', 1200),
            stack: trimText(event.error && event.error.stack, 4000),
            file: safeResource(event.filename),
            line: event.lineno,
            column: event.colno
          });
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          report({
            kind: 'unhandled-rejection',
            message: trimText(reason && reason.message ? reason.message : reason, 1200),
            stack: trimText(reason && reason.stack, 4000)
          });
        });
      })();
    </script>

    <!-- Android/PWA status bar follows the same neutral surface as the app header. -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const LIGHT_HEADER = '#ffffff';
        const DARK_HEADER = '#0f1115';
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        const darkMedia = window.matchMedia('(prefers-color-scheme: dark)');

        const getStoredTheme = () => {
          try {
            return window.localStorage.getItem('theme');
          } catch {
            return null;
          }
        };

        const syncThemeColor = () => {
          if (!themeMeta) return;

          const root = document.documentElement;
          const storedTheme = getStoredTheme();
          const hasResolvedClass = root.classList.contains('light') || root.classList.contains('dark');
          const isDark = hasResolvedClass
            ? root.classList.contains('dark')
            : storedTheme === 'dark' || (storedTheme !== 'light' && darkMedia.matches);

          themeMeta.setAttribute('content', isDark ? DARK_HEADER : LIGHT_HEADER);
        };

        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['class'],
        });
        darkMedia.addEventListener?.('change', syncThemeColor);
      })();
    </script>

    <style>
      #alsamos-boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        background: #ffffff;

      #alsamos-boot-fallback .boot-card {
        width: min(100%, 360px);
      }

      #alsamos-boot-fallback .boot-spinner {
        width: 30px;
        height: 30px;
        margin: 0 auto 16px;
        border: 3px solid #e5e7eb;
        border-top-color: #111827;
        border-radius: 999px;
        animation: alsamos-boot-spin 0.85s linear infinite;
      }

      #alsamos-boot-fallback strong {
        display: block;
        font-size: 18px;
      }

      #alsamos-boot-fallback p {
        margin: 8px 0 0;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.55;
      }

      #alsamos-boot-retry {
        width: 100%;
        min-height: 44px;
        margin-top: 18px;
        border: 0;
        border-radius: 12px;
        background: #111827;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
      }

      @keyframes alsamos-boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-color-scheme: dark) {
        #alsamos-boot-fallback {
          background: #0f1115;
          color: #f9fafb;
        }
        #alsamos-boot-fallback .boot-spinner {
          border-color: #30343b;
          border-top-color: #f9fafb;
        }
        #alsamos-boot-fallback p { color: #9ca3af; }
        #alsamos-boot-retry { background: #f9fafb; color: #111827; }
      }
    </style>

    <div id="root">
      <div id="alsamos-boot-fallback" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-spinner" aria-hidden="true"></div>
          <strong>Alsamos yuklanmoqda</strong>
          <p id="alsamos-boot-status">Ilova ishga tushirilmoqda…</p>
          <button id="alsamos-boot-retry" type="button" hidden onclick="window.location.reload()">
            Qayta yuklash
          </button>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(() => {
        const fallback = document.getElementById('alsamos-boot-fallback');
        if (!fallback) return;
        const status = document.getElementById('alsamos-boot-status');
        const retry = document.getElementById('alsamos-boot-retry');
        if (status) status.textContent = 'Yuklash odatdagidan uzoq davom etdi. Internetni tekshirib, qayta yuklang.';
        if (retry) retry.hidden = false;
      }, 10000);
    </script>
