services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --appendonly
      - "yes"
    volumes:
      - livekit-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Required. Keep both values in the host secret store, never in Git.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    # Open on the host firewall:
    # - 7881/TCP
    # - 3478/UDP
    # - 50000-60000/UDP
    # Put 7880 behind trusted TLS and expose it as wss://<livekit-domain>.

volumes:
  livekit-redis:
