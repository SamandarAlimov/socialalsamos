services:
  alsamos-ai-sandbox:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      SANDBOX_API_KEY: "${SANDBOX_API_KEY}"
      SANDBOX_IMAGE: "alsamos-ai-runner:latest"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
