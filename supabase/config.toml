project_id = "socialalsamos"

# The hosted project ref is supplied by CI through SUPABASE_PROJECT_REF.
# Do not commit production project identifiers or credentials here.

# =====================================================================
# Hosted Auth configuration
#
# @alsamos.com is currently an Alsamos identity namespace. mail.alsamos.com is
# not yet available, so signup must create an authenticated session immediately
# and must not depend on an email-confirmation link.
# =====================================================================
[auth]
site_url = "https://alsamos.com"
additional_redirect_urls = [
  "https://www.alsamos.com",
  "https://alsamos.com/reset-password",
  "https://www.alsamos.com/reset-password"
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# =====================================================================
# verify_jwt policy
#
# verify_jwt = false means Supabase does NOT check a JWT before the
# function runs, so the function itself MUST authorise every request.
# Each entry below states how that is done. Anything without an explicit
# reason is a bug.
# =====================================================================

# --- Alsamos identity auth ------------------------------------------------
[functions.account-signup]
verify_jwt = false

[functions.account-login]
verify_jwt = false

[functions.account-session]
verify_jwt = false

[functions.account-create]
verify_jwt = false

[functions.account-revoke]
verify_jwt = false

[functions.account-2fa]
verify_jwt = false

[functions.account-devices]
verify_jwt = false

# --- Realtime signalling --------------------------------------------------
[functions.webrtc-signaling]
verify_jwt = false

[functions.live-stream-signaling]
verify_jwt = false

# --- AI endpoints ---------------------------------------------------------
[functions.ai-assistant]
verify_jwt = true

[functions.ai-agent]
verify_jwt = true

# Durable worker is called server-to-server with the project anon JWT and also
# validates a high-entropy per-run dispatch token inside the function.
[functions.ai-agent-worker]
verify_jwt = true

[functions.code-sandbox]
verify_jwt = true

[functions.ai-generate-image]
verify_jwt = true

[functions.smart-reply]
verify_jwt = true

[functions.summarize-email]
verify_jwt = true

# --- Proxies / third party ------------------------------------------------
[functions.mini-app-proxy]
verify_jwt = false

[functions.giphy-search]
verify_jwt = false

# --- Scheduled jobs ------------------------------------------------------
[functions.send-scheduled-messages]
verify_jwt = false

[functions.publish-scheduled-posts]
verify_jwt = false

[functions.rate-limit-notification]
verify_jwt = false

# --- Public API surface ---------------------------------------------------
[functions.api-gateway]
verify_jwt = false

# --- OAuth2 / OpenID Connect ---------------------------------------------
[functions.oauth-authorize]
verify_jwt = false

[functions.oauth-clients]
verify_jwt = false

[functions.oauth-revoke]
verify_jwt = false

[functions.oauth-token]
verify_jwt = false

[functions.oauth-userinfo]
verify_jwt = false

[functions.openid-configuration]
verify_jwt = false

# --- Cross-domain SSO ----------------------------------------------------
[functions.sso-session]
verify_jwt = false

# --- Public transport realtime --------------------------------------------
[functions.transit-realtime]
verify_jwt = false

# --- First-party Global Search crawler --------------------------------------
[functions.web-crawler]
verify_jwt = false

# --- Realtime Global Search ------------------------------------------------
[functions.global-search]
verify_jwt = false
