name: Apply video controls fix

on:
  push:
    branches:
      - fix/video-keyboard-navigation

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[video-controls-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-keyboard-navigation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused player interaction patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex did not match: {pattern[:100]!r}')
              write(path, next_text)

          utility = "\n".join([
              "export function resolveVideoDigitSeekTarget(key: string, duration: number): number | null {",
              "  if (!/^[0-9]$/.test(key)) return null;",
              "  if (!Number.isFinite(duration) || duration <= 0) return null;",
              "  return (Number(key) / 10) * duration;",
              "}",
              "",
              "export function resolveAdjacentVideoIndex(",
              "  currentIndex: number,",
              "  totalVideos: number,",
              "  delta: -1 | 1,",
              "): number {",
              "  if (!Number.isFinite(currentIndex) || totalVideos <= 0) return 0;",
              "  return Math.min(totalVideos - 1, Math.max(0, currentIndex + delta));",
              "}",
              "",
          ])
          write('src/lib/videoKeyboardControls.ts', utility)

          replace_once('src/pages/VideosPage.tsx',
              "  ArrowLeft,\n  Bookmark,\n  Gauge,",
              "  ArrowLeft,\n  Bookmark,\n  ChevronDown,\n  ChevronUp,\n  Gauge,")
          replace_once('src/pages/VideosPage.tsx',
              "import { resolveTouchAxis, type TouchAxis } from '@/lib/touchGesture';",
              "import { resolveTouchAxis, type TouchAxis } from '@/lib/touchGesture';\nimport { resolveAdjacentVideoIndex, resolveVideoDigitSeekTarget } from '@/lib/videoKeyboardControls';")
          replace_once('src/pages/VideosPage.tsx',
              "      if (event.metaKey || event.ctrlKey || event.altKey) return;\n\n      switch (event.key.toLowerCase()) {",
              "      if (event.metaKey || event.ctrlKey || event.altKey) return;\n\n      const digitTarget = resolveVideoDigitSeekTarget(\n        event.key,\n        videoRef.current?.duration ?? duration,\n      );\n      if (digitTarget !== null) {\n        event.preventDefault();\n        handleSeek(digitTarget);\n        return;\n      }\n\n      switch (event.key.toLowerCase()) {")
          replace_once('src/pages/VideosPage.tsx',
              "  }, [isActive, keyboardEnabled, onMuteToggle, seekBy, toggleFullscreen, togglePlay]);",
              "  }, [duration, handleSeek, isActive, keyboardEnabled, onMuteToggle, seekBy, toggleFullscreen, togglePlay]);")

          feed_nav = "\n".join([
              "  const moveFeedBy = useCallback((delta: -1 | 1) => {",
              "    const container = containerRef.current;",
              "    if (!container || container.clientHeight <= 0 || rankedVideos.length === 0) return;",
              "    const next = resolveAdjacentVideoIndex(activeIndex, rankedVideos.length, delta);",
              "    if (next === activeIndex) return;",
              "",
              "    setActiveIndex(next);",
              "    mediumTap();",
              "    container.scrollTo({",
              "      top: next * container.clientHeight,",
              "      behavior: 'smooth',",
              "    });",
              "  }, [activeIndex, mediumTap, rankedVideos.length]);",
              "",
              "  useEffect(() => {",
              "    if (watchVideoId || commentsOpen || shareDialogOpen || likesDialogOpen) return;",
              "    const handler = (event: KeyboardEvent) => {",
              "      const target = event.target instanceof HTMLElement ? event.target : null;",
              "      if (target?.closest('input, textarea, select, button, a, [contenteditable=\"true\"], [role=\"slider\"]')) return;",
              "      if (event.metaKey || event.ctrlKey || event.altKey || document.fullscreenElement) return;",
              "",
              "      if (event.key === 'ArrowUp') {",
              "        event.preventDefault();",
              "        moveFeedBy(-1);",
              "      } else if (event.key === 'ArrowDown') {",
              "        event.preventDefault();",
              "        moveFeedBy(1);",
              "      }",
              "    };",
              "    window.addEventListener('keydown', handler);",
              "    return () => window.removeEventListener('keydown', handler);",
              "  }, [commentsOpen, likesDialogOpen, moveFeedBy, shareDialogOpen, watchVideoId]);",
              "",
          ])
          anchor = "  useEffect(() => {\n    if (isLoading || !hasMore || rankedVideos.length === 0) return;"
          replace_once('src/pages/VideosPage.tsx', anchor, feed_nav + anchor)

          reel_buttons = "\n".join([
              "      {floatingBack}",
              "      {!isMobile && !watchVideoId && !commentsOpen && !shareDialogOpen && !likesDialogOpen && rankedVideos.length > 1 && (",
              "        <div className=\"absolute right-5 top-1/2 z-[55] flex -translate-y-1/2 flex-col gap-3\">",
              "          <button",
              "            type=\"button\"",
              "            onClick={() => moveFeedBy(-1)}",
              "            disabled={activeIndex === 0}",
              "            aria-label=\"Oldingi videoga o‘tish\"",
              "            className=\"flex h-11 w-11 items-center justify-center rounded-full bg-black/55 text-white shadow-lg ring-1 ring-white/15 backdrop-blur-xl transition hover:bg-black/70 active:scale-95 disabled:cursor-not-allowed disabled:opacity-30\"",
              "          >",
              "            <ChevronUp className=\"h-6 w-6\" />",
              "          </button>",
              "          <button",
              "            type=\"button\"",
              "            onClick={() => moveFeedBy(1)}",
              "            disabled={activeIndex >= rankedVideos.length - 1}",
              "            aria-label=\"Keyingi videoga o‘tish\"",
              "            className=\"flex h-11 w-11 items-center justify-center rounded-full bg-black/55 text-white shadow-lg ring-1 ring-white/15 backdrop-blur-xl transition hover:bg-black/70 active:scale-95 disabled:cursor-not-allowed disabled:opacity-30\"",
              "          >",
              "            <ChevronDown className=\"h-6 w-6\" />",
              "          </button>",
              "        </div>",
              "      )}",
              "      <div",
              "        ref={containerRef}",
          ])
          replace_once('src/pages/VideosPage.tsx',
              "      {floatingBack}\n      <div\n        ref={containerRef}",
              reel_buttons)

          replace_once('src/components/video/VideoWatchPanel.tsx',
              "import { UI_LAYER } from '@/lib/uiLayers';",
              "import { UI_LAYER } from '@/lib/uiLayers';\nimport { resolveVideoDigitSeekTarget } from '@/lib/videoKeyboardControls';")
          replace_once('src/components/video/VideoWatchPanel.tsx',
              "    publishPlayback({ time, paused: el.paused });\n    if (time < duration) setIsEnded(false);\n  }, [duration, publishPlayback]);",
              "    publishPlayback({ time, paused: el.paused });\n    if (time < duration) setIsEnded(false);\n    revealControls();\n  }, [duration, publishPlayback, revealControls]);")
          replace_once('src/components/video/VideoWatchPanel.tsx',
              "      if (event.metaKey || event.ctrlKey || event.altKey) return;\n      switch (event.key.toLowerCase()) {",
              "      if (event.metaKey || event.ctrlKey || event.altKey) return;\n\n      const digitTarget = resolveVideoDigitSeekTarget(\n        event.key,\n        videoRef.current?.duration ?? duration,\n      );\n      if (digitTarget !== null) {\n        event.preventDefault();\n        handleSeek(digitTarget);\n        return;\n      }\n\n      switch (event.key.toLowerCase()) {")
          replace_once('src/components/video/VideoWatchPanel.tsx',
              "        case 'j': event.preventDefault(); seekBy(-10); break;\n        case 'l': event.preventDefault(); seekBy(10); break;",
              "        case 'j': event.preventDefault(); seekBy(-10); break;\n        case 'l': event.preventDefault(); seekBy(10); break;\n        case 'arrowleft': event.preventDefault(); seekBy(-5); break;\n        case 'arrowright': event.preventDefault(); seekBy(5); break;")
          replace_once('src/components/video/VideoWatchPanel.tsx',
              "  }, [closeWithPlayback, keyboardEnabled, seekBy, toggleFullscreen, togglePlay]);",
              "  }, [closeWithPlayback, duration, handleSeek, keyboardEnabled, seekBy, toggleFullscreen, togglePlay]);")

          regex_once('src/hooks/useVideoSurfaceTap.ts',
              r"function isVideoWatchSurface\(surface: HTMLElement\) \{.*?\n\}\n\nfunction revealVideoWatchControls\(surface: HTMLElement\) \{.*?\n\}\n\n",
              "")
          replace_once('src/hooks/useVideoSurfaceTap.ts',
              " * - YouTube-style VideoWatchPanel single tap: reveal controls without changing\n *   playback; play/pause remains an explicit controller action;",
              " * - YouTube-style VideoWatchPanel single tap: play/pause through the caller;")
          regex_once('src/hooks/useVideoSurfaceTap.ts',
              r"\n        if \(hit && isVideoWatchSurface\(hit\.surface\)\) \{\n          revealVideoWatchControls\(hit\.surface\);\n          return;\n        \}",
              "")

          replace_once('src/hooks/useVideoSurfaceTap.test.tsx',
              "import { resolveVideoDoubleTapZone, useVideoSurfaceTap } from './useVideoSurfaceTap';",
              "import { resolveAdjacentVideoIndex, resolveVideoDigitSeekTarget } from '@/lib/videoKeyboardControls';\nimport { resolveVideoDoubleTapZone, useVideoSurfaceTap } from './useVideoSurfaceTap';")

          helper_tests = "\n".join([
              "describe('video keyboard controls', () => {",
              "  it('maps 0-9 to YouTube-style 0%-90% timeline positions', () => {",
              "    expect(resolveVideoDigitSeekTarget('0', 120)).toBe(0);",
              "    expect(resolveVideoDigitSeekTarget('1', 120)).toBe(12);",
              "    expect(resolveVideoDigitSeekTarget('5', 120)).toBe(60);",
              "    expect(resolveVideoDigitSeekTarget('9', 120)).toBe(108);",
              "  });",
              "",
              "  it('ignores non-digit keys and invalid durations', () => {",
              "    expect(resolveVideoDigitSeekTarget('k', 120)).toBeNull();",
              "    expect(resolveVideoDigitSeekTarget('1', 0)).toBeNull();",
              "    expect(resolveVideoDigitSeekTarget('1', Number.NaN)).toBeNull();",
              "  });",
              "",
              "  it('clamps Reel previous/next navigation to feed bounds', () => {",
              "    expect(resolveAdjacentVideoIndex(0, 4, -1)).toBe(0);",
              "    expect(resolveAdjacentVideoIndex(1, 4, -1)).toBe(0);",
              "    expect(resolveAdjacentVideoIndex(1, 4, 1)).toBe(2);",
              "    expect(resolveAdjacentVideoIndex(3, 4, 1)).toBe(3);",
              "  });",
              "});",
              "",
              "",
          ])
          replace_once('src/hooks/useVideoSurfaceTap.test.tsx',
              "describe('useVideoSurfaceTap', () => {",
              helper_tests + "describe('useVideoSurfaceTap', () => {")

          new_watch_test = "\n".join([
              "  it('routes VideoWatchPanel single taps to the play pause callback', () => {",
              "    const surface = document.createElement('div');",
              "    const video = document.createElement('video');",
              "    const backButton = document.createElement('button');",
              "    backButton.setAttribute('aria-label', 'Videolarga qaytish');",
              "    surface.append(video, backButton);",
              "    document.body.appendChild(surface);",
              "",
              "    Object.defineProperty(document, 'elementFromPoint', {",
              "      configurable: true,",
              "      value: vi.fn(() => surface),",
              "    });",
              "",
              "    const onSingleTap = vi.fn();",
              "    const onDoubleTap = vi.fn();",
              "    const { result } = renderHook(() =>",
              "      useVideoSurfaceTap({ onSingleTap, onDoubleTap, delay: 240 }),",
              "    );",
              "",
              "    act(() => {",
              "      result.current.registerTap(150, 220);",
              "      vi.advanceTimersByTime(240);",
              "    });",
              "",
              "    expect(onSingleTap).toHaveBeenCalledTimes(1);",
              "    expect(onDoubleTap).not.toHaveBeenCalled();",
              "  });",
              "",
              "",
          ])
          regex_once('src/hooks/useVideoSurfaceTap.test.tsx',
              r"  it\('reveals VideoWatchPanel controls on single tap instead of toggling playback'.*?\n  \}\);\n\n(?=  it\('collapses an expanded caption)",
              new_watch_test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Video interaction regression
        run: npx vitest run src/hooks/useVideoSurfaceTap.test.tsx

      - name: Typecheck
        run: npm run typecheck:create

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-video-controls-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/VideosPage.tsx src/components/video/VideoWatchPanel.tsx src/hooks/useVideoSurfaceTap.ts src/hooks/useVideoSurfaceTap.test.tsx src/lib/videoKeyboardControls.ts .github/workflows/apply-video-controls-fix.yml
          git commit -m "fix: add YouTube video keyboard and reel navigation [video-controls-fix-applied]"
          git push origin HEAD:fix/video-keyboard-navigation
