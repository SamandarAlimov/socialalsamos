name: Cleanup Vercel Deployments

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE_OLD_DEPLOYMENTS to allow deletion"
        required: true
        type: string

# A newly triggered cleanup cancels any older long-running cleanup. This is
# critical because an old deletion loop must never keep deleting deployments
# created by newer commits.
concurrency:
  group: cleanup-vercel-deployments
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'DELETE_OLD_DEPLOYMENTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_TOKEN: ${{ secrets.Alsamos || secrets.ALSAMOS || secrets.VERCEL_TOKEN || secrets.VERCEL_TOLEN || secrets.VERCEL_API_TOKEN || vars.Alsamos || vars.ALSAMOS || vars.VERCEL_TOKEN || vars.VERCEL_TOLEN || vars.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_ID: prj_tHXhupcKJ12WyZbmMuYT9Rxr3Av7
      VERCEL_TEAM_ID: team_0fG0uQFrIhfa3pnXHCWRNTmd

    steps:
      - name: Verify token exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN GitHub Actions secret topilmadi."
            exit 1
          fi

      - name: Wait for this commit's production deployment
        id: keep
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "$@"
          }

          echo "Waiting for Vercel deployment for commit ${GITHUB_SHA}..."
          KEEP_ID=""
          KEEP_URL=""

          for attempt in $(seq 1 90); do
            json="$(api "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=100")"

            row="$(printf '%s' "$json" | jq -r --arg sha "$GITHUB_SHA" '
              [.deployments[]
                | select(.meta.githubCommitSha == $sha)
                | {uid, url, state, target, created}]
              | sort_by(.created)
              | reverse
              | .[0] // empty
              | @base64
            ')"

            if [ -n "$row" ]; then
              decoded="$(printf '%s' "$row" | base64 -d)"
              state="$(printf '%s' "$decoded" | jq -r '.state')"
              target="$(printf '%s' "$decoded" | jq -r '.target // ""')"
              id="$(printf '%s' "$decoded" | jq -r '.uid')"
              url="$(printf '%s' "$decoded" | jq -r '.url')"

              echo "Found deployment: $id state=$state target=$target"

              if [ "$state" = "READY" ] && [ "$target" = "production" ]; then
                KEEP_ID="$id"
                KEEP_URL="$url"
                break
              fi

              if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
                echo "::error::Current commit deployment failed ($state). Cleanup aborted so the last working deployment is preserved."
                exit 1
              fi
            fi

            sleep 10
          done

          if [ -z "$KEEP_ID" ]; then
            echo "::error::Could not confirm a READY production deployment for this commit. Cleanup aborted."
            exit 1
          fi

          echo "Keeping deployment: $KEEP_ID ($KEEP_URL)"
          echo "keep_id=$KEEP_ID" >> "$GITHUB_OUTPUT"
          echo "keep_url=$KEEP_URL" >> "$GITHUB_OUTPUT"

      - name: Snapshot old deployments
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail

          keep="${{ steps.keep.outputs.keep_id }}"
          json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=100")"

          # Snapshot only terminal deployments that already exist now.
          # Never delete BUILDING/QUEUED/INITIALIZING deployments, and never
          # refresh the deletion set later. A future deployment is therefore safe.
          printf '%s' "$json" | jq -r --arg keep "$keep" '
            .deployments[]
            | select(.uid != $keep)
            | select(.state == "READY" or .state == "ERROR" or .state == "CANCELED")
            | .uid
          ' > /tmp/vercel-cleanup-snapshot.txt

          count="$(grep -cve '^$' /tmp/vercel-cleanup-snapshot.txt || true)"
          echo "Snapshotted old terminal deployments: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Delete snapshotted old deployments
        shell: bash
        run: |
          set -euo pipefail

          deleted=0
          rate_waits=0

          delete_one() {
            local id="$1"

            while true; do
              code="$(curl --silent --show-error \
                --output /tmp/delete-response.json \
                --write-out "%{http_code}" \
                --request DELETE \
                --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v13/deployments/$id?teamId=${VERCEL_TEAM_ID}")"

              if [ "$code" = "200" ] || [ "$code" = "204" ] || [ "$code" = "404" ]; then
                deleted=$((deleted + 1))
                return 0
              fi

              if [ "$code" = "429" ]; then
                reset_ms="$(jq -r '.error.limit.reset // empty' /tmp/delete-response.json 2>/dev/null || true)"
                if [ -n "$reset_ms" ] && [ "$reset_ms" != "null" ]; then
                  now_s="$(date +%s)"
                  reset_s=$((reset_ms / 1000))
                  wait_s=$((reset_s - now_s + 3))
                  if [ "$wait_s" -lt 5 ]; then wait_s=5; fi
                else
                  wait_s=610
                fi
                rate_waits=$((rate_waits + 1))
                echo "Vercel delete rate-limit reached. Waiting ${wait_s}s, then continuing..."
                sleep "$wait_s"
                continue
              fi

              echo "::warning::Delete failed for $id (HTTP $code). Response:"
              cat /tmp/delete-response.json || true
              return 1
            done
          }

          while IFS= read -r id; do
            [ -z "$id" ] && continue
            delete_one "$id"
          done < /tmp/vercel-cleanup-snapshot.txt

          echo "Snapshot cleanup finished."
          echo "Deleted deployments: $deleted"
          echo "Rate-limit waits: $rate_waits"

      - name: Verify protected production still exists
        shell: bash
        run: |
          set -euo pipefail

          json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=100")"

          keep_present="$(printf '%s' "$json" | jq -r --arg keep "${{ steps.keep.outputs.keep_id }}" 'any(.deployments[]; .uid == $keep)')"
          count="$(printf '%s' "$json" | jq '.deployments | length')"

          echo "Current visible deployments: $count"
          echo "Protected production preserved: $keep_present"

          if [ "$keep_present" != "true" ]; then
            echo "::error::Expected production deployment is not present after cleanup."
            exit 1
          fi

          # Do not require count == 1. Deployments created after the snapshot are
          # intentionally preserved and may legitimately exist now.
