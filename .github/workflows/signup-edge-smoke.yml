name: Signup Edge Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/signup-edge-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify account-signup edge transport
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -o "$body_file" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://alsamos.com' \
            --data '{}' \
            'https://tcykulflvagvwuygwgmu.supabase.co/functions/v1/account-signup' || true)"
          echo "HTTP status: $status"
          cat "$body_file"
          echo
          test "$status" = "400"
          grep -q 'INVALID_REQUEST' "$body_file"
