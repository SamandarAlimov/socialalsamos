name: One-shot remove synthetic-email reset

on:
  push:
    branches:
      - fix/first-party-no-email-auth
    paths:
      - .github/workflows/one-shot-remove-email-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-party-no-email-auth
      - name: Remove mailbox reset API from AuthContext
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/contexts/AuthContext.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '* `identifier` may be an email, a username or a phone number.',
              '* `identifier` is an Alsamos username or a phone number.',
          )
          text = text.replace(
              "  requestPasswordReset: (email: string) => Promise<AuthResult>;\n",
              "",
          )
          text = text.replace(
              "  // Signup (identity creation) - the identity email must be @alsamos.com,\n  // while login later accepts email, username or phone.\n",
              "  // Signup (identity creation) - @alsamos.com is an internal credential only.\n  // Public login accepts username or phone; no mailbox is required.\n",
          )

          pattern = re.compile(
              r"\n  const requestPasswordReset = async \(email: string\): Promise<AuthResult> => \{.*?\n  \};\n",
              re.S,
          )
          text, count = pattern.subn("\n", text, count=1)
          if count != 1:
              raise SystemExit(f'expected one requestPasswordReset implementation, found {count}')

          if "        requestPasswordReset,\n" not in text:
              raise SystemExit('requestPasswordReset provider entry not found')
          text = text.replace("        requestPasswordReset,\n", "", 1)

          if 'resetPasswordForEmail' in text or 'requestPasswordReset' in text:
              raise SystemExit('email reset symbols remain after cleanup')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-remove-email-reset.yml
          git config user.name "Alsamos Auth Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/contexts/AuthContext.tsx .github/workflows/one-shot-remove-email-reset.yml
          git commit -m "fix(auth): remove synthetic-email password reset path"
          git push origin HEAD:fix/first-party-no-email-auth
