name: Fix Create flashlight

on:
  push:
    branches:
      - fix/create-ios-flashlight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/create-ios-flashlight
          fetch-depth: 0

      - name: Apply camera flashlight patch
        run: python3 .github/scripts/fix_create_flashlight.py

      - name: Verify focused camera regression and build
        run: |
          npm ci
          npx vitest run src/components/create/cameraCaptureUtils.test.ts src/lib/iosCameraCanvasPreview.test.ts
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/create/useCameraCapture.ts src/components/create/CameraVideoRecorder.tsx src/components/create/cameraCaptureUtils.test.ts
          git commit -m "fix(create): make camera flashlight work on iPhone"
          git push origin HEAD:fix/create-ios-flashlight
