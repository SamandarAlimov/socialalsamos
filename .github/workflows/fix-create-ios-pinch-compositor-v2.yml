name: Fix Create iOS pinch compositor v2

on:
  push:
    branches:
      - fix/create-ios-pinch-compositor-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/create-ios-pinch-compositor-v2
          fetch-depth: 0

      - name: Apply iOS pinch compositor repair
        run: python3 .github/scripts/fix_create_ios_pinch_compositor_v2.py

      - name: Verify camera regression, typecheck and build
        run: |
          npm ci
          npx vitest run src/lib/iosCameraCanvasPreview.test.ts src/components/create/cameraCaptureUtils.test.ts
          npm run typecheck
          npm run build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/create/useCameraCapture.ts src/hooks/useCameraFilterRail.ts src/lib/iosCameraCanvasPreview.test.ts
          git commit -m "fix(create): stabilize iOS camera while pinch zooming"
          git push origin HEAD:fix/create-ios-pinch-compositor-v2
