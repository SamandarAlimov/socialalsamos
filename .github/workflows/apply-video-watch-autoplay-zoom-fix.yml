name: Apply video watch autoplay and zoom fix

on:
  push:
    branches:
      - fix/video-watch-autoplay-zoom-pan

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[watch-autoplay-zoom-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-watch-autoplay-zoom-pan
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused Watch player fixes
        run: python3 .github/scripts/apply_video_watch_autoplay_zoom_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Video interaction regression
        run: npx vitest run src/hooks/usePinchZoom.test.tsx src/hooks/useVideoSurfaceTap.test.tsx

      - name: Typecheck
        run: npm run typecheck:create

      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/apply-video-watch-autoplay-zoom-fix.yml
          rm .github/scripts/apply_video_watch_autoplay_zoom_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add Watch autoplay and zoom panning [watch-autoplay-zoom-fix-applied]"
          git push origin HEAD:fix/video-watch-autoplay-zoom-pan
