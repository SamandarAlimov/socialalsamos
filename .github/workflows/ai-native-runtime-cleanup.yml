name: AI native runtime cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-native-runtime-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI mode ownership and remove legacy browser GitHub mutations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/pages/AIPageV2.tsx')
          text = page.read_text(encoding='utf-8')

          legacy_import = """import {\n  canRunGithubActions,\n  detectGithubAction,\n  githubActionLabel,\n  githubActionsBlock,\n  runGithubAction,\n} from '@/lib/ai/githubActions';\n"""
          if legacy_import not in text:
              raise SystemExit('legacy githubActions import not found')
          text = text.replace(legacy_import, '', 1)

          old_cap = "import { toolLabel, type ModelId, type ToolGroupId } from '@/lib/ai/capabilities';"
          new_cap = "import { toolLabel, type AIMode, type ModelId, type ToolGroupId } from '@/lib/ai/capabilities';"
          if old_cap not in text:
              raise SystemExit('capabilities import not found')
          text = text.replace(old_cap, new_cap, 1)

          old_consts = "const PREFS_KEY = 'alsamos.ai.prefs';\n"
          if old_consts not in text:
              raise SystemExit('prefs const not found')
          text = text.replace(old_consts, old_consts + "const MODE_KEY = 'alsamos.ai.mode';\n", 1)

          model_state = "  const [model, setModel] = useState<ModelId>(initialPrefs.model);\n"
          mode_state = """  const [mode, setMode] = useState<AIMode>(() => {\n    try {\n      const saved = localStorage.getItem(MODE_KEY);\n      return saved === 'chat' ? 'chat' : 'agent';\n    } catch {\n      return 'agent';\n    }\n  });\n"""
          if model_state not in text:
              raise SystemExit('model state not found')
          text = text.replace(model_state, model_state + mode_state, 1)

          prefs_effect = """  useEffect(() => {\n    try {\n      localStorage.setItem(PREFS_KEY, JSON.stringify({ model, toolGroups }));\n    } catch {\n      // ignore\n    }\n  }, [model, toolGroups]);\n"""
          if prefs_effect not in text:
              raise SystemExit('prefs effect not found')
          mode_effect = """\n  useEffect(() => {\n    try {\n      localStorage.setItem(MODE_KEY, mode);\n    } catch {\n      // ignore\n    }\n  }, [mode]);\n"""
          text = text.replace(prefs_effect, prefs_effect + mode_effect, 1)

          action_start = text.find("      const action = lastUser")
          brain_start = text.find("      const brainContext = [", action_start)
          if action_start == -1 or brain_start == -1:
              raise SystemExit('legacy github action block markers not found')
          text = text[:action_start] + text[brain_start:]

          old_brain = """      const brainContext = [\n        buildBrainContext({\n          userText: lastUser?.content ?? '',\n          conversations,\n          currentConversationId,\n          activeProject,\n        }),\n        githubActionsBlock(),\n      ].join('\\n\\n');\n"""
          new_brain = """      const brainContext = buildBrainContext({\n        userText: lastUser?.content ?? '',\n        conversations,\n        currentConversationId,\n        activeProject,\n      });\n"""
          if old_brain not in text:
              raise SystemExit('brain context legacy block not found')
          text = text.replace(old_brain, new_brain, 1)

          old_mode_field = "        mode: 'agent',\n"
          if text.count(old_mode_field) < 2:
              raise SystemExit('expected assistant/request agent mode fields not found')
          text = text.replace(old_mode_field, "        mode,\n", 2)

          composer_anchor = "      activeModel={activeModel}\n"
          if composer_anchor not in text:
              raise SystemExit('composer activeModel anchor not found')
          text = text.replace(composer_anchor, composer_anchor + "      mode={mode}\n      onModeChange={setMode}\n", 1)

          page.write_text(text, encoding='utf-8')

          composer = Path('src/components/ai/AIComposer.tsx')
          text = composer.read_text(encoding='utf-8')
          old = """export function AIComposer(props: Props) {\n  const [mode, setMode] = useState<AIMode>(initialMode);\n  const [pendingRun, setPendingRun] = useState<PendingRun | null>(readPendingRun);\n"""
          new = """export function AIComposer(props: Props) {\n  const [internalMode, setInternalMode] = useState<AIMode>(initialMode);\n  const mode = props.mode ?? internalMode;\n  const changeMode = useCallback((nextMode: AIMode) => {\n    setInternalMode(nextMode);\n    props.onModeChange?.(nextMode);\n  }, [props.onModeChange]);\n  const [pendingRun, setPendingRun] = useState<PendingRun | null>(readPendingRun);\n"""
          if old not in text:
              raise SystemExit('AIComposer mode state block not found')
          text = text.replace(old, new, 1)
          if "onClick={() => setMode(id)}" not in text:
              raise SystemExit('AIComposer mode click not found')
          text = text.replace("onClick={() => setMode(id)}", "onClick={() => changeMode(id)}", 1)
          tail = "<AIComposerV2 {...props} mode={mode} onModeChange={setMode} />"
          if tail not in text:
              raise SystemExit('AIComposerV2 mode tail not found')
          text = text.replace(tail, "<AIComposerV2 {...props} mode={mode} onModeChange={changeMode} />", 1)
          composer.write_text(text, encoding='utf-8')

          client = Path('src/lib/ai/agentClient.ts')
          text = client.read_text(encoding='utf-8')
          text = text.replace("const MODE_KEY = 'alsamos.ai.mode';\n", '', 1)
          start = text.find('function selectedMode(fallback: AIMode): AIMode {')
          auth = text.find('async function authHeaders()', start)
          if start == -1 or auth == -1:
              raise SystemExit('selectedMode block not found')
          text = text[:start] + text[auth:]
          old_stream = """export async function streamAgent(options: StreamAgentOptions): Promise<void> {\n  const mode = selectedMode(options.mode);\n  const effective = { ...options, mode };\n"""
          new_stream = """export async function streamAgent(options: StreamAgentOptions): Promise<void> {\n  const mode = options.mode;\n  const effective = { ...options, mode };\n"""
          if old_stream not in text:
              raise SystemExit('streamAgent selectedMode call not found')
          text = text.replace(old_stream, new_stream, 1)
          client.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Alsamos AI"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/AIPageV2.tsx src/components/ai/AIComposer.tsx src/lib/ai/agentClient.ts
          git rm .github/workflows/ai-native-runtime-cleanup.yml
          git commit -m "fix(ai): make native runtime authoritative"
          git push origin HEAD:main
