name: AI understanding hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-understanding-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply hardening patch
        run: python3 scripts/ai-understanding-hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Targeted regression tests
        run: npx vitest run src/lib/ai/githubIntent.test.ts src/lib/supabaseJwtRecovery.test.ts src/lib/ai/agentClient.test.ts

      - name: API typecheck
        run: npm run typecheck:api

      - name: Production build
        run: npm run build

      - name: Commit hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Alsamos AI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            supabase/functions/_shared/aiIntent.ts \
            supabase/functions/_shared/aiTools.ts \
            supabase/functions/_shared/aiGitHubTools.ts \
            supabase/functions/_shared/aiAgentRuntime.ts \
            src/lib/ai/githubIntent.test.ts \
            src/lib/ai/githubConnector.ts \
            src/lib/supabaseJwtRecovery.ts \
            src/lib/supabaseJwtRecovery.test.ts
          git diff --cached --check
          git commit -m "fix(ai): harden intent fidelity and tool truth"
          git push
