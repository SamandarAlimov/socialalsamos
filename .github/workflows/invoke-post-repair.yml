name: One-shot Signup Backend Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/invoke-post-repair.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise production Auth create path
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp)"
          STATUS="$(curl --silent --show-error --max-time 45 -o "$TMP" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://alsamos.com' \
            -H 'x-alsamos-diagnostic: full-signup-selftest' \
            --data '{}' \
            https://tcykulflvagvwuygwgmu.supabase.co/functions/v1/account-signup)"
          echo "HTTP $STATUS"
          cat "$TMP"
          echo
          test "$STATUS" = "200"
