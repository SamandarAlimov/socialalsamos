name: Smoke Global Search

on:
  push:
    branches: [main]
    paths:
      - "api/global-search.ts"
      - "src/components/search/GlobalSearchResults.tsx"
      - "src/pages/SearchPage.tsx"
      - ".github/workflows/smoke-global-search.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Firecrawl-backed production Global Search
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_URL='https://instant-find-it.lovable.app/api/search?q=OpenAI&category=web&page=1&pageSize=5&locale=en'
          ALSAMOS_URL='https://www.alsamos.com/api/global-search?q=OpenAI&category=web&page=1&pageSize=5&locale=en'
          TMP_REMOTE="$(mktemp)"
          TMP_ALSAMOS="$(mktemp)"

          remote_status=$(curl --silent --show-error --max-time 30 -o "$TMP_REMOTE" -w '%{http_code}' "$REMOTE_URL" || true)
          echo "instant-find-it HTTP $remote_status"
          cat "$TMP_REMOTE" || true
          echo

          if [ "$remote_status" != "200" ]; then
            echo "::error::instant-find-it is not published/updated yet, so its Firecrawl API is not publicly reachable."
            exit 1
          fi

          python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); r=d.get("results") or []; e=str(d.get("engine") or ""); err=d.get("error"); print("remote engine:",e,"results:",len(r),"error:",err); raise SystemExit(0 if e=="firecrawl-lovable" and len(r)>0 and not err else 1)' "$TMP_REMOTE"

          for attempt in $(seq 1 12); do
            echo "Alsamos production attempt $attempt"
            if curl --fail --silent --show-error --max-time 45 "$ALSAMOS_URL" -o "$TMP_ALSAMOS"; then
              cat "$TMP_ALSAMOS"
              echo
              if python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); r=d.get("results") or []; e=str(d.get("engine") or ""); err=d.get("error"); print("Alsamos engine:",e,"results:",len(r),"error:",err); raise SystemExit(0 if e.startswith("instant-find-it:firecrawl-") and len(r)>0 and not err else 1)' "$TMP_ALSAMOS"; then
                echo "Alsamos Firecrawl Global Search production smoke test passed."
                exit 0
              fi
            fi
            sleep 12
          done

          echo "::error::Alsamos production is not serving the Firecrawl-backed Global Search build yet."
          exit 1
