name: Repair Historical Migration Sources

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-migration-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-historical-migrations
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair migration SQL compatibility
        shell: python
        run: |
          from pathlib import Path

          files = {
              "supabase/migrations/20260828225000_hashtag_normalization_compat.sql": {
                  "dollar_quotes": True,
                  "trgm": False,
                  "limit_offset": False,
              },
              "supabase/migrations/20260828230000_create_flow_foundation.sql": {
                  "dollar_quotes": False,
                  "trgm": True,
                  "limit_offset": False,
              },
              "supabase/migrations/20260830092000_create_visibility_media.sql": {
                  "dollar_quotes": True,
                  "trgm": True,
                  "limit_offset": False,
              },
              "supabase/migrations/20260831010500_first_party_global_search.sql": {
                  "dollar_quotes": False,
                  "trgm": True,
                  "limit_offset": True,
              },
          }

          for name, opts in files.items():
              path = Path(name)
              text = path.read_text()
              original = text

              if opts["dollar_quotes"]:
                  # Two historical files accidentally used a single '$' delimiter.
                  text = text.replace("do $\n", "do $$\n")
                  text = text.replace("as $\n", "as $$\n")
                  text = text.replace("\n$;", "\n$$;")

              if opts["trgm"]:
                  # pg_trgm is installed in Supabase's extensions schema.
                  text = text.replace(" gin_trgm_ops", " extensions.gin_trgm_ops")
                  text = text.replace("similarity(", "extensions.similarity(")
                  text = text.replace(" % ", " OPERATOR(extensions.%) ")

              if opts["limit_offset"]:
                  # SQL-language functions cannot use CTE columns directly in LIMIT/OFFSET.
                  text = text.replace("limit params.lim", "limit (select lim from params)")
                  text = text.replace("offset params.off", "offset (select off from params)")

              if text == original:
                  print(f"No change needed: {name}")
              else:
                  path.write_text(text)
                  print(f"Repaired: {name}")

      - name: Make legacy hashtag aggregate compatibility idempotent
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/migrations/20260828225000_hashtag_normalization_compat.sql")
          text = path.read_text()
          marker = "-- Keep the legacy aggregate view name alive for older readers."
          if marker in text and "hashtags_aggregated compatibility is handled by relation kind" not in text:
              before, _ = text.split(marker, 1)
              replacement = r'''-- Keep the legacy aggregate view name alive for older readers.
-- hashtags_aggregated compatibility is handled by relation kind so this migration
-- is safe on legacy installs where the name is already a materialized view.
do $$
declare
  v_kind "char";
begin
  select c.relkind into v_kind
  from pg_class c
  join pg_namespace n on n.oid = c.relnamespace
  where n.nspname = 'public' and c.relname = 'hashtags_aggregated';

  if v_kind is null then
    execute $sql$
      create view public.hashtags_aggregated as
      select h.tag, h.posts_count::bigint as post_count, h.last_used_at
      from public.hashtags h
    $sql$;
  elsif v_kind = 'v' then
    execute $sql$
      create or replace view public.hashtags_aggregated as
      select h.tag, h.posts_count::bigint as post_count, h.last_used_at
      from public.hashtags h
    $sql$;
  end if;
end
$$;
'''
              path.write_text(before + replacement)
              print("Repaired hashtags_aggregated compatibility")

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260828225000_hashtag_normalization_compat.sql \
                  supabase/migrations/20260828230000_create_flow_foundation.sql \
                  supabase/migrations/20260830092000_create_visibility_media.sql \
                  supabase/migrations/20260831010500_first_party_global_search.sql
          git commit -m "fix(db): repair historical Supabase migrations"
          git push origin HEAD:main
