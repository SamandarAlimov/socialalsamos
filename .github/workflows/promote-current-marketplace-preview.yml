name: Promote Current Marketplace Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-current-marketplace-preview.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.Alsamos || secrets.ALSAMOS || secrets.VERCEL_TOKEN || secrets.VERCEL_TOLEN || secrets.VERCEL_API_TOKEN || vars.Alsamos || vars.ALSAMOS || vars.VERCEL_TOKEN || vars.VERCEL_TOLEN || vars.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_ID: prj_tHXhupcKJ12WyZbmMuYT9Rxr3Av7
      VERCEL_TEAM_ID: team_0fG0uQFrIhfa3pnXHCWRNTmd
      VERCEL_DEPLOYMENT_ID: dpl_FXEmXr21Ur1XFKWVYdWbnbyymSf9

    steps:
      - name: Verify token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::Vercel token not found"; exit 1; }

      - name: Promote existing READY deployment
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error             --output /tmp/promote-response.txt             --write-out "%{http_code}"             --request POST             --header "Authorization: Bearer ${VERCEL_TOKEN}"             "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${VERCEL_DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}")"
          cat /tmp/promote-response.txt || true
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "::error::Vercel promote failed with HTTP $code"
            exit 1
          fi
          echo "Promotion accepted with HTTP $code"
