name: One-shot clean auth email fragment

on:
  push:
    branches:
      - fix/first-party-no-email-auth
    paths:
      - .github/workflows/one-shot-clean-auth-email-fragment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-party-no-email-auth
      - name: Remove orphaned email input tail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/AuthPage.tsx')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n[ \t]*autoComplete="email"\n'
              r'[ \t]*autoCapitalize="none"\n'
              r'[ \t]*spellCheck=\{false\}\n'
              r'[ \t]*required\n'
              r'[ \t]*/>\n'
          )
          cleaned, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one orphaned email field tail, found {count}')
          path.write_text(cleaned, encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-clean-auth-email-fragment.yml
          git config user.name "Alsamos Auth Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/AuthPage.tsx .github/workflows/one-shot-clean-auth-email-fragment.yml
          git commit -m "fix(auth): remove final email field fragment"
          git push origin HEAD:fix/first-party-no-email-auth
