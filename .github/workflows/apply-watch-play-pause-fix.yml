name: Apply Watch play pause fix

on:
  push:
    branches:
      - fix/watch-play-pause-audit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[watch-play-pause-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Watch player interaction state
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/video/VideoWatchPanel.tsx')
          text = path.read_text()

          replacements = []

          replacements.append((
          """  const holdActiveRef = useRef(false);\n  const speedRef = useRef(1);""",
          """  const holdActiveRef = useRef(false);\n  const holdStartedPausedRef = useRef(false);\n  const speedRef = useRef(1);"""
          ))

          replacements.append((
          """    setIsEnded(false);\n    setIsPlaying(!playback.paused);\n    zoom.resetZoom();""",
          """    setIsEnded(false);\n    // Reflect the real media element state; onPlay is the source of truth.\n    setIsPlaying(false);\n    zoom.resetZoom();"""
          ))

          replacements.append((
          """      desiredPausedRef.current = false;\n      void el.play().catch(() => setIsPlaying(false));\n      publishPlayback({ time: el.currentTime, paused: false });""",
          """      desiredPausedRef.current = false;\n      void el.play().catch(() => {\n        // Do not leave the parent snapshot in a synthetic playing state when\n        // the browser rejects/aborts play().\n        desiredPausedRef.current = true;\n        setIsPlaying(false);\n        publishPlayback({ time: el.currentTime, paused: true });\n      });"""
          ))

          replacements.append((
          """      clearPending();\n      holdActiveRef.current = true;\n      el.playbackRate = 2;\n      if (el.paused) {\n        desiredPausedRef.current = false;\n        void el.play().catch(() => setIsPlaying(false));\n      }\n      mediumTap();""",
          """      clearPending();\n      holdActiveRef.current = true;\n      holdStartedPausedRef.current = el.paused || desiredPausedRef.current;\n      el.playbackRate = 2;\n      if (el.paused) {\n        desiredPausedRef.current = false;\n        void el.play().catch(() => {\n          desiredPausedRef.current = true;\n          setIsPlaying(false);\n        });\n      }\n      mediumTap();"""
          ))

          replacements.append((
          """    if (!holdActiveRef.current) return false;\n    holdActiveRef.current = false;\n    if (videoRef.current) videoRef.current.playbackRate = speedRef.current;\n    return true;\n  }, []);""",
          """    if (!holdActiveRef.current) return false;\n    holdActiveRef.current = false;\n    const startedPaused = holdStartedPausedRef.current;\n    holdStartedPausedRef.current = false;\n\n    const el = videoRef.current;\n    if (el) {\n      el.playbackRate = speedRef.current;\n      // A YouTube-style hold may preview at 2x, but releasing a hold that\n      // started from pause must return to pause instead of silently changing\n      // the user's play/pause intent.\n      if (startedPaused) {\n        desiredPausedRef.current = true;\n        const time = Number.isFinite(el.currentTime) ? el.currentTime : currentTime;\n        el.pause();\n        publishPlayback({ time, paused: true });\n      }\n    }\n    return true;\n  }, [currentTime, publishPlayback]);"""
          ))

          replacements.append((
          """            if (!endHold()) registerTap(event.clientX, event.clientY);\n          }}\n          onPointerCancel={(event) => {\n            zoom.handlers.onPointerCancel(event);\n            endHold();\n          }}\n          onPointerLeave={() => endHold()}\n          onDoubleClick={(event) => event.preventDefault()}""",
          """            if (!endHold()) {\n              if (event.pointerType === 'mouse') {\n                // Desktop YouTube interaction: mouse play/pause should respond\n                // on release immediately instead of waiting for the 240ms\n                // touch double-tap arbitration window.\n                clearPending();\n                togglePlay();\n              } else {\n                registerTap(event.clientX, event.clientY);\n              }\n            }\n          }}\n          onPointerCancel={(event) => {\n            zoom.handlers.onPointerCancel(event);\n            endHold();\n          }}\n          onPointerLeave={() => endHold()}\n          onDoubleClick={(event) => {\n            const target = event.target instanceof HTMLElement ? event.target : null;\n            if (target?.closest('button, a, input, textarea, select, [role=\"slider\"], [data-video-interactive=\"true\"]')) return;\n            event.preventDefault();\n            void toggleFullscreen();\n          }}"""
          ))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Install dependencies
        run: npm ci
      - name: Video interaction regression
        run: npx vitest run src/hooks/useVideoSurfaceTap.test.tsx
      - name: Check Watch type safety
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E 'src/components/video/VideoWatchPanel\.tsx|src/hooks/useVideoSurfaceTap' /tmp/typecheck.log; then
            echo 'Watch-related typecheck error detected.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo '::warning::Repo-wide typecheck has unrelated existing errors; no Watch player file is implicated.'
          fi
      - name: Production build
        run: npm run build
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-watch-play-pause-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/video/VideoWatchPanel.tsx .github/workflows/apply-watch-play-pause-fix.yml
          git commit -m "fix: stabilize Watch play pause interactions [watch-play-pause-fix-applied]"
          git push
