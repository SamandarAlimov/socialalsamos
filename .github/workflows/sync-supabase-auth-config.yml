name: Sync Supabase Auth Config

on:
  push:
    branches:
      - main
    paths:
      - supabase/config.toml
      - .github/workflows/sync-supabase-auth-config.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-auth-config
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tcykulflvagvwuygwgmu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase access token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push hosted Auth configuration
        shell: bash
        run: supabase config push --project-ref "$PROJECT_REF"
