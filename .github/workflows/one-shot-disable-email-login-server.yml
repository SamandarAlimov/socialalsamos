name: One-shot disable public email login

on:
  push:
    branches:
      - fix/first-party-no-email-auth
    paths:
      - .github/workflows/one-shot-disable-email-login-server.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-party-no-email-auth
      - name: Reject email identifiers at the public login boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/account-login/index.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  if (kind === "invalid") {
    await recordAttempt(admin, identifierHash, ip, "failure");
    await audit(admin, req, {
      eventType: "login",
      outcome: "failure",
      reason: "malformed_identifier",
    });
    return authError(req, "INVALID_CREDENTIALS", 401);
  }
'''
          new = '''  if (kind === "invalid" || kind === "email") {
    await recordAttempt(admin, identifierHash, ip, "failure");
    await audit(admin, req, {
      eventType: "login",
      outcome: "failure",
      reason: kind === "email" ? "email_login_disabled" : "malformed_identifier",
      metadata: { identifier_kind: kind },
    });
    return authError(req, "INVALID_CREDENTIALS", 401);
  }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one public identifier guard, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit server guard and remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-disable-email-login-server.yml
          git config user.name "Alsamos Auth Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/account-login/index.ts .github/workflows/one-shot-disable-email-login-server.yml
          git commit -m "fix(auth): reject public email login identifiers"
          git push origin HEAD:fix/first-party-no-email-auth
