name: Deploy Supabase Edge Functions Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-supabase-functions-only.yml'

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy every Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name repository secret is missing."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every Supabase Edge Function
        shell: bash
        run: |
          chmod +x scripts/supabase/deploy-functions.sh
          scripts/supabase/deploy-functions.sh
