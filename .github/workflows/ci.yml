name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/supabase/deploy-database.sh
          bash -n scripts/supabase/deploy-functions.sh
          python3 -m py_compile \
            scripts/supabase/runtime-secrets.py \
            scripts/supabase/remote-health.py
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path('supabase/config.toml').read_text(encoding='utf-8'))
          assert config.get('project_id') == 'socialalsamos'
          print('Supabase deployment tooling syntax/config validation passed')
          PY

      - name: Enforce first-party no-email auth contract
        run: node scripts/check-no-email-auth.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Messages regression tests
        run: npm run test:messages

      - name: Native WebRTC transport regression
        run: npx vitest run src/lib/iceServers.test.ts src/lib/webrtcSignalPolicy.test.ts

      - name: Media regression tests
        run: npx vitest run src/lib/mediaRecovery.test.ts src/lib/mediaRefs.test.ts src/lib/videoPostMedia.test.ts src/hooks/useVideoSurfaceTap.test.tsx src/lib/videoHoldGesture.test.ts src/lib/videoCommentsGeometry.test.ts

      - name: Canonical engagement regression
        run: npx vitest run src/lib/canonicalEngagement.test.ts

      - name: Create regression tests
        run: npx vitest run src/lib/videoPipeline.test.ts src/lib/storyPublishing.test.ts

      - name: Marketplace module smoke tests
        run: npx vitest run src/pages/marketplaceModuleSmoke.test.ts

      - name: AI routing regression tests
        run: npx vitest run src/lib/ai/agentClient.test.ts

      - name: Messages typecheck
        run: npm run typecheck:messages

      - name: Typecheck
        run: npm run typecheck:create

      - name: API typecheck
        run: npm run typecheck:api

      - name: Production build
        run: npm run build
