name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json is currently behind package.json (FFmpeg deps were added
      # without refreshing the npm lock). npm install keeps CI diagnostic coverage
      # alive until the lock is regenerated and committed in a dedicated cleanup.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Messages regression tests
        run: npm run test:messages

      - name: Messages typecheck
        run: npm run typecheck:messages

      - name: Create regression tests
        run: npm run test:create

      - name: Create typecheck
        run: npm run typecheck:create

      - name: Full app typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
