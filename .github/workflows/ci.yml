name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Messages regression tests
        run: npm run test:messages

      - name: Media regression tests
        run: npx vitest run src/lib/mediaRecovery.test.ts

      - name: Messages typecheck
        run: npm run typecheck:messages

      - name: Typecheck
        run: npm run typecheck:create

      - name: API typecheck
        run: npm run typecheck:api

      - name: Production build
        run: npm run build
