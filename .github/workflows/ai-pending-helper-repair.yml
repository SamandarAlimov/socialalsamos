name: AI pending helper repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-pending-helper-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore durable pending-run helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/ai/agentClient.ts')
          text = path.read_text(encoding='utf-8')
          if 'function savePending(' in text:
              raise SystemExit('savePending already exists')
          anchor = 'async function authHeaders(): Promise<Record<string, string>> {'
          if anchor not in text:
              raise SystemExit('authHeaders anchor not found')
          helpers = '''function savePending(value: { runId: string; eventId: number; status: string; conversationId?: string | null } | null) {\n  try {\n    if (!value) localStorage.removeItem(PENDING_KEY);\n    else localStorage.setItem(PENDING_KEY, JSON.stringify(value));\n  } catch {\n    // storage may be unavailable in private mode\n  }\n}\n\nexport function readPendingAgentRun(): {\n  runId: string;\n  eventId: number;\n  status: string;\n  conversationId?: string | null;\n} | null {\n  try {\n    const raw = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');\n    return raw?.runId ? raw : null;\n  } catch {\n    return null;\n  }\n}\n\n'''
          text = text.replace(anchor, helpers + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Alsamos AI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/ai/agentClient.ts
          git rm .github/workflows/ai-pending-helper-repair.yml
          git commit -m "fix(ai): restore durable pending-run helpers"
          git push origin HEAD:main
