name: Apply YouTube Watch controller fix

on:
  push:
    branches:
      - fix/youtube-watch-controller-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[youtube-watch-controls-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply audited Watch patch
        shell: python
        run: |
          import subprocess

          source_commit = 'b36affa4aaf6cbada21eefbd6f43c9d50499574a'
          workflow_path = '.github/workflows/apply-youtube-watch-controller-fix.yml'
          raw = subprocess.check_output(
              ['git', 'show', f'{source_commit}:{workflow_path}'],
              text=True,
          )
          start_marker = "      - name: Patch Watch controller lifecycle\n        shell: python\n        run: |\n"
          end_marker = "      - name: Install dependencies\n"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          block = raw[start:end]
          script_lines = []
          for line in block.splitlines():
              script_lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, '<watch-controller-patch>', 'exec'))
      - name: Install dependencies
        run: npm ci
      - name: Watch interaction regression
        run: npx vitest run src/hooks/useVideoSurfaceTap.test.tsx
      - name: Check Watch type safety
        shell: bash
        run: |
          set +e
          npx tsc -p tsconfig.app.json --noEmit --pretty false > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/typecheck.log
          if grep -E 'src/(components/video/VideoWatchPanel|hooks/useVideoSurfaceTap|lib/videoWatchControls)' /tmp/typecheck.log; then
            echo 'Watch-related TypeScript errors found.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Repo-wide typecheck has pre-existing errors outside the Watch files; no Watch-related TypeScript errors were found.'
          fi
      - name: Production build
        run: npm run build
      - name: Commit audited Watch source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/video/VideoWatchPanel.tsx src/lib/videoWatchControls.ts src/hooks/useVideoSurfaceTap.ts src/hooks/useVideoSurfaceTap.test.tsx
          git commit -m "fix: align Watch controller lifecycle with YouTube [youtube-watch-controls-applied]"
          git push
