name: One-shot username phone auth migration

on:
  push:
    branches:
      - fix/first-party-no-email-auth
    paths:
      - .github/workflows/one-shot-username-phone-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-party-no-email-auth
          fetch-depth: 0

      - name: Remove user-facing email auth and enforce server identity login
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/AuthPage.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  Mail,\n', '')
          text = text.replace('  ALSAMOS_MAIL_DOMAIN,\n', '')
          text = text.replace('  isAlsamosEmail,\n', '')

          start = text.find('/** Login accepts an email, a username or a phone number. */')
          end = text.find('const loginSchema =', start)
          if start < 0 or end < 0:
              raise SystemExit('login identifier validator anchors not found')
          text = text[:start] + """/** Public login accepts only an Alsamos username or a phone number. */
          const identifierField = z
            .string()
            .trim()
            .min(3, 'Username yoki telefon raqamni kiriting')
            .max(255)
            .refine((value) => {
              const kind = classifyIdentifier(value);
              return kind === 'username' || kind === 'phone';
            }, {
              message: 'Username yoki telefon raqamni to’g’ri kiriting',
            });

          """ + text[end:]

          signup_start = text.find('/** Signup still creates an @alsamos.com identity. */')
          signup_schema = text.find('const signupSchema =', signup_start)
          if signup_start < 0 or signup_schema < 0:
              raise SystemExit('signup email field anchors not found')
          text = text[:signup_start] + '/** Signup creates an internal identity from the public username. */\n' + text[signup_schema:]
          text = text.replace('    email: signupEmailField,\n', '')
          text = text.replace("  const [email, setEmail] = useState('');\n", '')
          text = text.replace(
              '    () => checkPassword(password, [email, username, fullName]),\n    [password, email, username, fullName],',
              '    () => checkPassword(password, [username, fullName, phone]),\n    [password, username, fullName, phone],',
          )
          text = text.replace("    setEmail('');\n", '')
          text = text.replace('      email,\n', '')
          text = text.replace(
              '    const { error, needsEmailConfirmation } = await signup({\n      email: toIdentityEmail(parsed.data.email),',
              '    const { error } = await signup({\n      email: toIdentityEmail(parsed.data.username),',
          )
          text = text.replace(
              "\n    if (needsEmailConfirmation) {\n      setMode('login');\n      resetForm();\n      return;\n    }\n\n    navigate(nextPath);",
              "\n    navigate(nextPath);",
          )
          text = text.replace(
              "                  {loginStep.identity.email} · {loginStep.identity.used}/\n                  {loginStep.identity.max || MAX_ACCOUNTS_PER_IDENTITY}",
              "                  {loginStep.identity.used}/\n                  {loginStep.identity.max || MAX_ACCOUNTS_PER_IDENTITY} akkaunt",
          )
          text = text.replace('/* Email, username or phone number */', '/* Username or phone number */')
          text = text.replace('placeholder="Email, username yoki telefon raqam"', 'placeholder="Username yoki telefon raqam"')

          email_start = text.find('<Input\n                      type="email"')
          if email_start < 0:
              raise SystemExit('visible signup email input start not found')
          email_line_start = text.rfind('\n', 0, email_start) + 1
          email_end = text.find('/>', email_start)
          if email_end < 0:
              raise SystemExit('visible signup email input end not found')
          email_end = text.find('\n', email_end)
          if email_end < 0:
              email_end = len(text)
          else:
              email_end += 1
          text = text[:email_line_start] + text[email_end:]
          path.write_text(text, encoding='utf-8')

          path = Path('src/contexts/AuthContext.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  directPasswordLogin,\n', '')
          text = text.replace('  requestAccountSession,\n', '  requestAccountSession,\n  requestLoginTicket,\n')
          text = text.replace('  repairFirstPartyIdentity,\n', '')
          begin = text.find('  const beginLogin = async')
          end = text.find('\n\n  const completeLogin', begin)
          if begin < 0 or end < 0:
              raise SystemExit('AuthContext beginLogin anchors not found')
          text = text[:begin] + """  const beginLogin = async (identifier: string, password: string): Promise<LoginStepResult> => {
            return requestLoginTicket(identifier, password);
          };""" + text[end:]
          text = text.replace(
              '  // Signing in talks ONLY to Supabase Auth (/auth/v1/token), exactly like the\n  // original implementation. No edge function is involved, so an undeployed or\n  // CORS-blocked `account-login` can never prevent anyone from logging in.\n',
              '  // Public authentication is username/phone based and flows through\n  // the identity endpoint so rate limits, TOTP and account selection are enforced.\n',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('supabase/functions/account-login/index.ts')
          text = path.read_text(encoding='utf-8')
          block_start = text.find('  const anon = anonClient();')
          block_end = text.find('\n\n  const { data: identity }', block_start)
          if block_start < 0 or block_end < 0:
              raise SystemExit('account-login auth block anchors not found')
          replacement = """  const anon = anonClient();
          let { data: signIn, error: signInError } = await anon.auth.signInWithPassword({
            email: resolved.loginEmail,
            password,
          });

          if (signInError && /not confirmed/i.test(signInError.message ?? "")) {
            const { data: verifiedUserId } = await admin.rpc("verify_alsamos_identity_password", {
              _email: resolved.loginEmail,
              _password: password,
            });
            if (typeof verifiedUserId === "string" && verifiedUserId) {
              const { error: confirmError } = await admin.auth.admin.updateUserById(verifiedUserId, {
                email_confirm: true,
              });
              if (!confirmError) {
                const retry = await anon.auth.signInWithPassword({
                  email: resolved.loginEmail,
                  password,
                });
                signIn = retry.data;
                signInError = retry.error;
                await audit(admin, req, {
                  eventType: "identity_confirmation_repair",
                  outcome: retry.error ? "failure" : "success",
                  reason: retry.error?.message ?? null,
                  identityId: resolved.identityId,
                  userId: verifiedUserId,
                });
              }
            }
          }

          if (signInError || !signIn?.user) {
            await recordAttempt(admin, identifierHash, ip, "failure");
            await audit(admin, req, {
              eventType: "login",
              outcome: "failure",
              reason: "invalid_credentials",
              identityId: resolved.identityId,
              metadata: { identifier_kind: kind },
            });
            return authError(req, "INVALID_CREDENTIALS", 401);
          }

          const userId = signIn.user.id;
          await anon.auth.signOut({ scope: "local" }).catch(() => {});

          if (!signIn.user.email_confirmed_at) {
            await audit(admin, req, {
              eventType: "login",
              outcome: "blocked",
              reason: "identity_confirmation_unavailable",
              identityId: resolved.identityId,
              userId,
            });
            return authError(req, "IDENTITY_UNAVAILABLE", 403);
          }"""
          text = text[:block_start] + replacement + text[block_end:]
          path.write_text(text, encoding='utf-8')

          auth_page = Path('src/pages/AuthPage.tsx').read_text(encoding='utf-8')
          auth_ctx = Path('src/contexts/AuthContext.tsx').read_text(encoding='utf-8')
          login_fn = Path('supabase/functions/account-login/index.ts').read_text(encoding='utf-8')
          for forbidden in ['type="email"', 'Email, username yoki telefon', 'signupEmailField', 'loginStep.identity.email']:
              if forbidden in auth_page:
                  raise SystemExit(f'user-facing email auth remains: {forbidden}')
          if 'toIdentityEmail(parsed.data.username)' not in auth_page:
              raise SystemExit('internal identity is not derived from username')
          if 'requestLoginTicket(identifier, password)' not in auth_ctx:
              raise SystemExit('canonical server identity login missing')
          if 'directPasswordLogin(identifier, password)' in auth_ctx:
              raise SystemExit('direct login still bypasses 2FA')
          if 'scope: "global"' in login_fn:
              raise SystemExit('global sign-out remains')
          PY

      - name: Remove one-shot workflow and commit migration
        shell: bash
        run: |
          rm .github/workflows/one-shot-username-phone-auth.yml
          git config user.name "Alsamos Auth Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/AuthPage.tsx src/contexts/AuthContext.tsx supabase/functions/account-login/index.ts .github/workflows/one-shot-username-phone-auth.yml
          git commit -m "fix(auth): make username and phone the public login identity"
          git push origin HEAD:fix/first-party-no-email-auth
