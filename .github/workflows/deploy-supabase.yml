name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ALSAMOS_SEARCH_API_KEY: ${{ secrets.ALSAMOS_SEARCH_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      CRAWLER_SECRET: ${{ secrets.CRAWLER_SECRET }}
      PAYME_MERCHANT_ID: ${{ secrets.PAYME_MERCHANT_ID }}
      PAYME_LOGIN: ${{ secrets.PAYME_LOGIN }}
      PAYME_KEY: ${{ secrets.PAYME_KEY }}
      PAYME_TEST_KEY: ${{ secrets.PAYME_TEST_KEY }}
      PAYME_CHECKOUT_URL: ${{ secrets.PAYME_CHECKOUT_URL }}
      ALSAMOS_APP_URL: ${{ secrets.ALSAMOS_APP_URL }}
      PROJECT_REF: mbhjganbihamoiqmankv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Production Supabase deploy is NOT configured. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        if: steps.gate.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Sync search secrets
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -n "$ALSAMOS_SEARCH_API_KEY" ]; then
            supabase secrets set ALSAMOS_SEARCH_API_KEY="$ALSAMOS_SEARCH_API_KEY" --project-ref "$PROJECT_REF"
          else
            echo "::notice::ALSAMOS_SEARCH_API_KEY is not configured; realtime Global Search will use the Alsamos index fallback."
          fi

          if [ -n "$FIRECRAWL_API_KEY" ]; then
            supabase secrets set FIRECRAWL_API_KEY="$FIRECRAWL_API_KEY" --project-ref "$PROJECT_REF"
          else
            echo "::notice::FIRECRAWL_API_KEY GitHub secret is not configured; existing Supabase secret is preserved."
          fi

          if [ -n "$LOVABLE_API_KEY" ]; then
            supabase secrets set LOVABLE_API_KEY="$LOVABLE_API_KEY" --project-ref "$PROJECT_REF"
          fi

          if [ -n "$CRAWLER_SECRET" ]; then
            supabase secrets set CRAWLER_SECRET="$CRAWLER_SECRET" --project-ref "$PROJECT_REF"
          fi

          if [ -n "$PAYME_MERCHANT_ID" ]; then
            supabase secrets set PAYME_MERCHANT_ID="$PAYME_MERCHANT_ID" --project-ref "$PROJECT_REF"
          fi
          if [ -n "$PAYME_LOGIN" ]; then
            supabase secrets set PAYME_LOGIN="$PAYME_LOGIN" --project-ref "$PROJECT_REF"
          fi
          if [ -n "$PAYME_KEY" ]; then
            supabase secrets set PAYME_KEY="$PAYME_KEY" --project-ref "$PROJECT_REF"
          fi
          if [ -n "$PAYME_TEST_KEY" ]; then
            supabase secrets set PAYME_TEST_KEY="$PAYME_TEST_KEY" --project-ref "$PROJECT_REF"
          fi
          if [ -n "$PAYME_CHECKOUT_URL" ]; then
            supabase secrets set PAYME_CHECKOUT_URL="$PAYME_CHECKOUT_URL" --project-ref "$PROJECT_REF"
          fi
          if [ -n "$ALSAMOS_APP_URL" ]; then
            supabase secrets set ALSAMOS_APP_URL="$ALSAMOS_APP_URL" --project-ref "$PROJECT_REF"
          else
            supabase secrets set ALSAMOS_APP_URL="https://www.alsamos.com/payment?topup=return" --project-ref "$PROJECT_REF"
          fi

          if [ -z "$PAYME_MERCHANT_ID" ] || [ -z "$PAYME_LOGIN" ] || [ -z "$PAYME_KEY" ]; then
            echo "::warning::Payme live money is not active yet. Configure PAYME_MERCHANT_ID, PAYME_LOGIN and PAYME_KEY repository secrets after merchant onboarding."
          fi

      - name: Push database migrations
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase db push --linked --include-all

      - name: Deploy Global Search
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase functions deploy global-search --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Smoke Firecrawl Global Search
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/global-search"
          BODY='{"query":"OpenAI","category":"web","page":1,"pageSize":5,"locale":"en"}'
          TMP="$(mktemp)"

          for attempt in $(seq 1 8); do
            echo "Global Search smoke attempt $attempt"
            if curl --fail --silent --show-error --max-time 45 \
              -H 'Content-Type: application/json' \
              -d "$BODY" "$URL" -o "$TMP"; then
              cat "$TMP"
              echo
              if python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); r=d.get("results") or []; e=str(d.get("engine") or ""); err=d.get("error"); print("engine:",e,"results:",len(r),"error:",err); raise SystemExit(0 if e.startswith("firecrawl-") and len(r)>0 and not err else 1)' "$TMP"; then
                echo "Firecrawl Global Search is live."
                exit 0
              fi
            fi
            sleep 8
          done

          echo "::error::Firecrawl Global Search did not become live. Check FIRECRAWL_API_KEY / Lovable Firecrawl connection."
          exit 1

      - name: Deploy Payme wallet checkout
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase functions deploy wallet-payme-create --project-ref "$PROJECT_REF"

      - name: Deploy Payme Merchant API
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase functions deploy wallet-payme-merchant --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy web crawler
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase functions deploy web-crawler --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy AI assistant fallback
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase functions deploy ai-assistant --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy AI code sandbox
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase functions deploy code-sandbox --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy full AI agent
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: supabase functions deploy ai-agent --project-ref "$PROJECT_REF" --no-verify-jwt
