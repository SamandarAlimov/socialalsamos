name: Deploy Supabase Production

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/bootstrap/generated/**'
      - 'scripts/supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Database mode. auto is safest for the first rebuild; normal pushes are incremental.'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - incremental
          - fresh

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Schema + Auth config + Secrets + Edge Functions + Health
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Optional provider/runtime credentials. Values are only synced when the
      # corresponding GitHub Secret exists; no secret value is committed.
      ALSAMOS_SEARCH_API_KEY: ${{ secrets.ALSAMOS_SEARCH_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CRAWLER_SECRET: ${{ secrets.CRAWLER_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PAYME_MERCHANT_ID: ${{ secrets.PAYME_MERCHANT_ID }}
      PAYME_LOGIN: ${{ secrets.PAYME_LOGIN }}
      PAYME_KEY: ${{ secrets.PAYME_KEY }}
      PAYME_TEST_KEY: ${{ secrets.PAYME_TEST_KEY }}
      PAYME_CHECKOUT_URL: ${{ secrets.PAYME_CHECKOUT_URL }}
      ALSAMOS_APP_URL: ${{ secrets.ALSAMOS_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name repository secret is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three required secrets in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare deployment scripts
        shell: bash
        run: chmod +x scripts/supabase/*.sh scripts/supabase/*.py

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Detect safe database mode
        id: mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'incremental' }}
        run: |
          set -euo pipefail
          detected="$(python3 scripts/supabase/remote-health.py mode)"
          requested="$REQUESTED_MODE"

          if [ "$requested" = "auto" ]; then
            selected="$detected"
          else
            selected="$requested"
          fi

          if [ "$detected" = "mixed" ]; then
            echo "::error::Remote schema is partially populated: some Alsamos core tables exist and some are missing. Refusing automatic repair because a fresh bootstrap could overwrite/conflict with real data."
            exit 1
          fi

          if [ "$selected" = "fresh" ] && [ "$detected" != "fresh" ]; then
            echo "::error::Fresh mode is allowed only when the public schema is truly empty. Detected state: $detected"
            exit 1
          fi

          if [ "$selected" = "incremental" ] && [ "$detected" = "fresh" ]; then
            echo "::error::The project is empty. Run this workflow manually once with mode=auto (or fresh) so the full historical Alsamos bootstrap is applied."
            exit 1
          fi

          echo "selected_mode=$selected" >> "$GITHUB_OUTPUT"
          echo "Detected database state: $detected"
          echo "Selected deployment mode: $selected"

      - name: Deploy database schema and reconcile migration history
        shell: bash
        run: scripts/supabase/deploy-database.sh "${{ steps.mode.outputs.selected_mode }}"

      - name: Push hosted Auth and function configuration
        shell: bash
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Sync configured Edge Function runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "Syncing Supabase secret name: $name"
              supabase secrets set "$name=$value" --project-ref "$SUPABASE_PROJECT_REF" >/dev/null
            fi
          }

          sync_secret ALSAMOS_SEARCH_API_KEY "${ALSAMOS_SEARCH_API_KEY:-}"
          sync_secret FIRECRAWL_API_KEY "${FIRECRAWL_API_KEY:-}"
          sync_secret CRAWLER_SECRET "${CRAWLER_SECRET:-}"
          sync_secret CRON_SECRET "${CRON_SECRET:-}"
          sync_secret GIPHY_API_KEY "${GIPHY_API_KEY:-}"
          sync_secret OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          sync_secret PAYME_MERCHANT_ID "${PAYME_MERCHANT_ID:-}"
          sync_secret PAYME_LOGIN "${PAYME_LOGIN:-}"
          sync_secret PAYME_KEY "${PAYME_KEY:-}"
          sync_secret PAYME_TEST_KEY "${PAYME_TEST_KEY:-}"
          sync_secret PAYME_CHECKOUT_URL "${PAYME_CHECKOUT_URL:-}"

          if [ -n "${ALSAMOS_APP_URL:-}" ]; then
            sync_secret ALSAMOS_APP_URL "$ALSAMOS_APP_URL"
          else
            # Not sensitive; this is the canonical payment return fallback.
            supabase secrets set \
              ALSAMOS_APP_URL="https://www.alsamos.com/payment?topup=return" \
              --project-ref "$SUPABASE_PROJECT_REF" >/dev/null
          fi

      - name: Inventory all custom Edge Function secret names
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/supabase/runtime-secrets.py \
            --output /tmp/alsamos-edge-runtime-secrets.txt \
            --details
          {
            echo '### Edge Function runtime secret inventory'
            echo
            echo 'Values are never printed. These are source-referenced custom secret names:'
            echo '```text'
            cat /tmp/alsamos-edge-runtime-secrets.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime secret-name inventory
        uses: actions/upload-artifact@v4
        with:
          name: supabase-runtime-secret-names
          path: /tmp/alsamos-edge-runtime-secrets.txt
          if-no-files-found: error
          retention-days: 14

      - name: Deploy every Supabase Edge Function
        shell: bash
        run: scripts/supabase/deploy-functions.sh

      - name: Verify production backend health
        shell: bash
        run: python3 scripts/supabase/remote-health.py verify

      - name: Show migration state
        shell: bash
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Alsamos Supabase production deployment'
            echo
            echo "- database mode: ${{ steps.mode.outputs.selected_mode || 'not-selected' }}"
            echo '- database: migrations are versioned and non-destructive by default'
            echo '- auth config: managed from supabase/config.toml'
            echo '- Edge Functions: auto-discovered from supabase/functions/*/index.ts'
            echo '- verify_jwt: derived from supabase/config.toml per function'
            echo '- health gate: social + marketplace + search + wallet + Auth-profile + RLS'
          } >> "$GITHUB_STEP_SUMMARY"
