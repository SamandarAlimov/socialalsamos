name: Patch marketplace mobile product creation

on:
  push:
    paths:
      - '.github/workflows/patch-marketplace-mobile-product.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch CreateProductDialog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/marketplace/CreateProductDialog.tsx')
          text = path.read_text()

          replacements = [
              (
                  "  const variantLimitExceeded = potentialVariantCount > MAX_VARIANTS;\n",
                  "  const variantLimitExceeded = potentialVariantCount > MAX_VARIANTS;\n  const hasUsableVariants = hasVariants && !variantLimitExceeded && generatedVariants.length > 0;\n",
              ),
              (
                  "    if (hasVariants && (variantLimitExceeded || generatedVariants.length === 0)) {\n      toast({\n        title: 'Variantlarni tekshiring',\n        description: variantLimitExceeded\n          ? `Bitta mahsulot uchun ko‘pi bilan ${MAX_VARIANTS} variant yarating.`\n          : 'Kamida bitta xususiyat nomi va qiymatlarini kiriting.',\n        variant: 'destructive',\n      });\n      return;\n    }\n\n    if (hasVariants) {\n",
                  "    if (hasVariants && variantLimitExceeded) {\n      toast({\n        title: 'Variantlarni tekshiring',\n        description: `Bitta mahsulot uchun ko‘pi bilan ${MAX_VARIANTS} variant yarating.`,\n        variant: 'destructive',\n      });\n      return;\n    }\n\n    if (hasUsableVariants) {\n",
              ),
              (
                  "    const totalStock = hasVariants\n",
                  "    const totalStock = hasUsableVariants\n",
              ),
              (
                  "      if (hasVariants) {\n        const variantsSaved = await createProductVariants(result.id, parsedVariants);\n",
                  "      if (hasUsableVariants) {\n        const variantsSaved = await createProductVariants(result.id, parsedVariants);\n",
              ),
              (
                  "        description: hasVariants\n",
                  "        description: hasUsableVariants\n",
              ),
              (
                  "                <p className=\"mt-0.5 text-xs text-muted-foreground\">\n                  {isRestaurant\n                    ? 'Taom media, porsiya, qo‘shimchalar, tayyorlash vaqti va yetkazishni bitta joyda boshqaring.'\n                    : 'Media, variantlar, ombor, SKU va xaritadagi joylashuvni bitta joyda boshqaring.'}\n                </p>\n",
                  "                {isRestaurant && (\n                  <p className=\"mt-0.5 text-xs text-muted-foreground\">\n                    Taom media, porsiya, qo‘shimchalar, tayyorlash vaqti va yetkazishni bitta joyda boshqaring.\n                  </p>\n                )}\n",
              ),
              (
                  "                {!hasVariants && (\n",
                  "                {!hasUsableVariants && (\n",
              ),
              (
                  "            <p className=\"hidden text-xs text-muted-foreground sm:block\">{hasVariants ? `${generatedVariants.length} variant · ${generatedVariants.reduce((sum, variant) => sum + Math.max(0, Number(readVariantEdit(variant.key).quantity) || 0), 0)} dona` : `${Math.max(0, Number(quantity) || 0)} dona`}</p>\n",
                  "            <p className=\"hidden text-xs text-muted-foreground sm:block\">{hasUsableVariants ? `${generatedVariants.length} variant · ${generatedVariants.reduce((sum, variant) => sum + Math.max(0, Number(readVariantEdit(variant.key).quantity) || 0), 0)} dona` : `${Math.max(0, Number(quantity) || 0)} dona`}</p>\n",
              ),
              (
                  "            <Button className=\"ml-auto h-11 min-w-44 rounded-xl\" onClick={() => void handleSubmit()} disabled={!title.trim() || !price || isSubmitting || isUploading || (hasVariants && (variantLimitExceeded || generatedVariants.length === 0))}>\n",
                  "            <Button className=\"ml-auto h-11 min-w-44 rounded-xl\" onClick={() => void handleSubmit()} disabled={!title.trim() || !price || isSubmitting || isUploading}>\n",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit marketplace fix and remove temporary workflow
        run: |
          git config user.name "SamandarAlimov"
          git config user.email "74458526+SamandarAlimov@users.noreply.github.com"
          git rm .github/workflows/patch-marketplace-mobile-product.yml
          git add src/components/marketplace/CreateProductDialog.tsx
          git commit -m "fix(marketplace): unblock mobile product publishing"
          git push origin HEAD:main
