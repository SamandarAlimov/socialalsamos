name: Patch Cloudinary Adapter

on:
  push:
    branches:
      - feat/cloudinary-media-adapter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudinary-media-adapter
          fetch-depth: 0

      - name: Patch client adapter and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          media = Path('src/lib/mediaUpload.ts')
          text = media.read_text()

          old = """  if (externalKey) {\n    if (externalKey.startsWith('private/')) {\n      return signExternalMediaKey(externalKey);\n    }\n    return `${EXTERNAL_MEDIA_PUBLIC_BASE}/${encodeMediaPath(externalKey)}`;\n  }\n"""
          new = """  if (externalKey) {\n    // Provider adapters such as Cloudinary may persist their HTTPS delivery URL\n    // as the external object key. Keep it provider-native instead of rewriting\n    // it through media.alsamos.com. Public Alsamos content permalinks remain\n    // /p, /reels and /stories; this URL is only the binary delivery layer.\n    if (isBrowserMediaUrl(externalKey)) return externalKey;\n    if (externalKey.startsWith('private/')) {\n      return signExternalMediaKey(externalKey);\n    }\n    return `${EXTERNAL_MEDIA_PUBLIC_BASE}/${encodeMediaPath(externalKey)}`;\n  }\n"""
          if old not in text:
              raise SystemExit('externalKey block not found')
          text = text.replace(old, new, 1)

          old = """type ExternalPresignResponse = {\n  upload_url?: string;\n  method?: string;\n  headers?: Record<string, string>;\n  public_url?: string;\n  key?: string;\n  bucket?: string;\n  visibility?: 'public' | 'private';\n};\n"""
          new = """type ExternalPresignResponse = {\n  provider?: string;\n  upload_url?: string;\n  method?: string;\n  headers?: Record<string, string>;\n  fields?: Record<string, string>;\n  public_url?: string;\n  key?: string;\n  bucket?: string;\n  visibility?: 'public' | 'private';\n};\n"""
          if old not in text:
              raise SystemExit('ExternalPresignResponse block not found')
          text = text.replace(old, new, 1)

          old = """  const uploadHeaders: Record<string, string> = {\n    ...(signed.headers ?? { 'Content-Type': contentType }),\n  };\n  if (!uploadHeaders['Content-Type']) uploadHeaders['Content-Type'] = contentType;\n  if (apiVisibility === 'private') {\n    uploadHeaders['Cache-Control'] = 'private, no-store, max-age=0';\n  }\n\n  const upload = await fetch(signed.upload_url, {\n    method: signed.method || 'PUT',\n    headers: uploadHeaders,\n    body: file,\n  });\n\n  if (!upload.ok) {\n    throw new Error(await readError(upload, 'Media serverga fayl yozilmadi'));\n  }\n\n  const storageUrl =\n    apiVisibility === 'public'\n      ? signed.public_url || `${EXTERNAL_MEDIA_PUBLIC_BASE}/${encodeMediaPath(signed.key)}`\n      : makeAlsamosMediaReference(signed.key);\n  const url =\n    apiVisibility === 'public'\n      ? storageUrl\n      : await signExternalMediaKey(signed.key);\n\n  return {\n    url,\n    storageUrl,\n    key: signed.key,\n    bucket: EXTERNAL_MEDIA_BUCKET,\n    type: contentType,\n    name: filename,\n    size: file.size,\n  };\n"""
          new = """  let upload: Response;\n  let providerPublicUrl: string | null = null;\n\n  if (signed.fields && Object.keys(signed.fields).length > 0) {\n    // Cloudinary and similar providers use a signed multipart form. The API\n    // secret never reaches the browser: /api/media-presign only returns the\n    // short-lived signature and public API key fields required for this file.\n    const form = new FormData();\n    for (const [field, value] of Object.entries(signed.fields)) {\n      form.append(field, value);\n    }\n    form.append('file', file, filename);\n\n    upload = await fetch(signed.upload_url, {\n      method: signed.method || 'POST',\n      body: form,\n    });\n\n    if (!upload.ok) {\n      throw new Error(await readError(upload, 'Media providerga fayl yozilmadi'));\n    }\n\n    try {\n      const providerResult = (await upload.clone().json()) as {\n        secure_url?: string;\n        url?: string;\n      };\n      providerPublicUrl = providerResult.secure_url || providerResult.url || null;\n    } catch {\n      providerPublicUrl = null;\n    }\n\n    if (signed.provider === 'cloudinary' && !providerPublicUrl) {\n      throw new Error('Cloudinary upload tugadi, lekin delivery URL qaytmadi');\n    }\n  } else {\n    const uploadHeaders: Record<string, string> = {\n      ...(signed.headers ?? { 'Content-Type': contentType }),\n    };\n    if (!uploadHeaders['Content-Type']) uploadHeaders['Content-Type'] = contentType;\n    if (apiVisibility === 'private') {\n      uploadHeaders['Cache-Control'] = 'private, no-store, max-age=0';\n    }\n\n    upload = await fetch(signed.upload_url, {\n      method: signed.method || 'PUT',\n      headers: uploadHeaders,\n      body: file,\n    });\n\n    if (!upload.ok) {\n      throw new Error(await readError(upload, 'Media serverga fayl yozilmadi'));\n    }\n  }\n\n  const storageUrl =\n    apiVisibility === 'public'\n      ? providerPublicUrl ||\n        signed.public_url ||\n        `${EXTERNAL_MEDIA_PUBLIC_BASE}/${encodeMediaPath(signed.key)}`\n      : makeAlsamosMediaReference(signed.key);\n  const url =\n    apiVisibility === 'public'\n      ? storageUrl\n      : await signExternalMediaKey(signed.key);\n  const resultKey = apiVisibility === 'public' && providerPublicUrl\n    ? providerPublicUrl\n    : signed.key;\n\n  return {\n    url,\n    storageUrl,\n    key: resultKey,\n    bucket: EXTERNAL_MEDIA_BUCKET,\n    type: contentType,\n    name: filename,\n    size: file.size,\n  };\n"""
          if old not in text:
              raise SystemExit('upload block not found')
          text = text.replace(old, new, 1)
          media.write_text(text)

          test = Path('src/lib/mediaUpload.test.ts')
          test_text = test.read_text()
          needle = """  it('keeps the original public reference when legacy signing is denied', async () => {\n"""
          addition = """  it('keeps a provider-native HTTPS delivery URL for external media', async () => {\n    const original = 'https://res.cloudinary.com/demo/image/upload/v1/alsamos/example.jpg';\n    const candidates = await resolveStorageUrlCandidates(original, 'alsamos-media', original);\n    expect(candidates).toEqual([original]);\n    expect(mocks.from).not.toHaveBeenCalled();\n  });\n\n"""
          if needle not in test_text:
              raise SystemExit('test insertion point not found')
          test_text = test_text.replace(needle, addition + needle, 1)
          test.write_text(test_text)

          env = Path('.env.example')
          env_text = env.read_text()
          old = """VITE_MEDIA_API_URL=\"https://api.alsamos.com\"\nVITE_MEDIA_PUBLIC_BASE_URL=\"https://media.alsamos.com/media\"\nVITE_MEDIA_ALLOW_SUPABASE_FALLBACK=\"true\"\n"""
          new = """VITE_MEDIA_API_URL=\"https://api.alsamos.com\"\nVITE_MEDIA_PUBLIC_BASE_URL=\"https://media.alsamos.com/media\"\nVITE_MEDIA_ALLOW_SUPABASE_FALLBACK=\"true\"\n# Temporary public-media provider adapter. Keep false until CLOUDINARY_URL is\n# configured as a SERVER-ONLY deployment secret. Never use VITE_ for the secret.\nVITE_EXTERNAL_MEDIA_UPLOAD_ENABLED=\"false\"\n# CLOUDINARY_URL=\"cloudinary://<api_key>:<api_secret>@<cloud_name>\"\n"""
          if old not in env_text:
              raise SystemExit('.env.example media block not found')
          env.write_text(env_text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify adapter
        run: |
          npm run typecheck:api
          npx vitest run src/lib/mediaUpload.test.ts

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/mediaUpload.ts src/lib/mediaUpload.test.ts .env.example
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete Cloudinary media adapter"
          git push origin HEAD:feat/cloudinary-media-adapter
