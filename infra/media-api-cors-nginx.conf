# Drop-in CORS config for api.alsamos.com media upload ingress.
# Install on the API nginx host inside the /api/media/ location or include it
# from the server block before proxying to the media API.

set $alsamos_cors_origin "";

if ($http_origin ~* "^https://(www\.)?alsamos\.com$") {
  set $alsamos_cors_origin $http_origin;
}

if ($http_origin ~* "^https://[a-z0-9-]+\.vercel\.app$") {
  set $alsamos_cors_origin $http_origin;
}

add_header Access-Control-Allow-Origin $alsamos_cors_origin always;
add_header Access-Control-Allow-Credentials "true" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, Cache-Control, X-Requested-With" always;
add_header Access-Control-Max-Age "86400" always;
add_header Vary "Origin" always;

if ($request_method = OPTIONS) {
  return 204;
}
